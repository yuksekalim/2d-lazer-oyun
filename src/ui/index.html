<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#f1f0ea">
        <title>Beamline — Laser Mirror Puzzle</title>
        <link rel="stylesheet" href="./styles.css?v=game-first-review-3">
    </head>
    <body>
        <div class="app-shell">
            <a class="skip-link" href="#game-board">Skip to game board</a>
            <header class="topbar">
                <a class="brand" href="./index.html" aria-label="Beamline home">
                    <span class="brand-mark" aria-hidden="true"><span></span></span>
                    <span>BEAMLINE</span>
                </a>
                <div class="topbar-center">
                    <nav class="difficulty-nav" id="difficulty-tabs" role="radiogroup" aria-label="Choose difficulty">
                        <button class="difficulty-tab is-active" type="button" role="radio" data-difficulty="easy" aria-checked="true">Easy</button>
                        <button class="difficulty-tab" type="button" role="radio" data-difficulty="medium" aria-checked="false">Medium</button>
                        <button class="difficulty-tab" type="button" role="radio" data-difficulty="hard" aria-checked="false">Hard</button>
                    </nav>
                </div>
                <div class="topbar-game-meta" aria-label="Campaign progress and lives">
                    <div class="campaign-progress">
                        <span class="campaign-progress-label">ROUTE</span>
                        <span class="level-tag" id="level-tag">01 / 10</span>
                        <progress class="campaign-progress-bar" id="campaign-progress" max="10" value="1" aria-label="Campaign progress"></progress>
                    </div>
                    <div class="lives-group">
                        <span class="lives-label" aria-hidden="true">LIVES</span>
                        <div class="board-lives" id="lives-row" aria-live="polite" aria-label="3 lives remaining" role="img">
                            <span class="heart is-filled" data-life="1" aria-hidden="true">♥</span>
                            <span class="heart is-filled" data-life="2" aria-hidden="true">♥</span>
                            <span class="heart is-filled" data-life="3" aria-hidden="true">♥</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="game-layout">
                <section class="game-panel" aria-label="Laser mirror puzzle">
                    <header class="game-heading">
                        <h1 id="game-title"><span class="level-name" id="level-name">Signal Thicket</span></h1>
                        <span class="board-size" id="board-size">7 × 7</span>
                    </header>

                    <div class="board-wrap" id="board-wrap">
                        <div id="game-board" class="game-board" role="grid" aria-label="7 by 7 laser puzzle board"></div>
                        <svg id="beam-layer" class="beam-layer" viewBox="0 0 7 7" preserveAspectRatio="none" aria-hidden="true"></svg>
                        <div class="board-glow" aria-hidden="true"></div>
                    </div>

                    <div class="game-controls">
                        <p class="interaction-hint">Click or tap a mirror to rotate it.</p>
                        <div class="control-actions">
                            <button class="reset-button" id="reset-button" type="button">
                                <span class="action-icon action-icon-reset" aria-hidden="true"></span>
                                <span>Reset</span>
                                <span class="button-shortcut">R</span>
                            </button>
                            <button class="reset-button fire-button" id="fire-button" type="button">
                                <span class="action-icon action-icon-play" aria-hidden="true"></span>
                                <span>Fire laser</span>
                                <span class="button-shortcut">↵</span>
                            </button>
                        </div>
                    </div>

                    <div class="game-status" id="status-card" data-state="idle" role="status" aria-live="polite" aria-atomic="true">
                        <div class="status-icon" aria-hidden="true"><span></span></div>
                        <div>
                            <p class="status-kicker" id="status-kicker"></p>
                            <p class="status-title" id="status-title">Aim the mirrors</p>
                            <p class="status-detail" id="status-detail"></p>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <div class="win-overlay" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
            <div class="win-card">
                <div class="win-burst" aria-hidden="true"><span class="win-burst-mark"></span></div>
                <p class="eyebrow" id="win-kicker">CAMPAIGN COMPLETE</p>
                <h2 id="win-title">Perfect<br><em>alignment.</em></h2>
                <p class="win-copy" id="win-copy">You solved the full campaign.</p>
                <div class="win-actions">
                    <button class="reset-button win-next" id="next-difficulty-button" type="button">Next difficulty <span class="action-arrow" aria-hidden="true"></span></button>
                    <button class="reset-button win-reset" id="play-again-button" type="button">Replay difficulty <span class="action-icon action-icon-reset" aria-hidden="true"></span></button>
                </div>
            </div>
        </div>

        <script type="module" src="./app.js?v=game-first-review-3"></script>
    </body>
</html>
